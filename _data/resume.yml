  - type: "job"
    title: "Data Scientist"
    org: "Starpoint Investment Firm"
    period: "Oct 2024 – Present"
    tag: "Full-time"
    purpose: >
      After joining M&T Tax Firm as a Business Intelligence Analyst in October
      2024, I continued with Starpoint Investment Firm following the merger and
      was promoted to Data Scientist in early 2026. I build and own BigQuery
      data pipelines, automated reporting, LLM-assisted document workflows,
      and an accounts-payable decision system across 5M+ records. These systems
      reduced monthly reporting from five days to one, automate 75% of data
      preparation, and reconcile about 120K invoices each month at an 88%
      straight-through rate. I also built the expense classifier, achieving
      0.925 macro-F1 across approximately 100 labels. Per-class confidence
      thresholds route uncertain cases to human review, balancing automation
      with financial data quality and accountable decisions.
    bullets:
      - "Cut reconciliation cycle time from 3–5 days to 1 day with 95% fewer reporting errors by designing optimized SQL workflows on point-of-sale and banking transaction data, replacing manual spreadsheet processes"
      - "Automated monthly financial statement generation and data validation across client portfolios, saving 15+ hours/month, by building 3 reusable SQL query templates with embedded data quality checks"
      - "Conducted YoY variance analysis on revenue growth, expense ratios, and cash flow trends across 10+ client portfolios, surfacing $175K in cost-reduction and tax-benefit opportunities adopted into client operational strategies"

