summary: >
  I'm a data scientist and computational researcher with a background in
  applied mathematics, biomedical research, and data systems. My experience
  spans molecular simulation, high-dimensional biological data, mechanistic
  model validation, forecasting, and analytics engineering. Across these
  settings, I have been most drawn to the same challenge: building methods
  that make complex data useful without hiding their assumptions or limits.

skills:
  - category: "Programming"
    items: [Python, pandas, NumPy, scikit-learn, PyTorch, SciPy, SQL, R, Bash, Scala]
  - category: "Statistics & ML"
    items: [Time-Series Forecasting, Walk-Forward CV, A/B Testing, Regression, Classification, "Clustering (PCA, k-means, DBSCAN)", Random Forest, XGBoost]
  - category: "Data Engineering & Cloud"
    items: [ETL Pipeline Design, Data Modeling, Data Warehousing, "AWS (S3, EMR, Athena)", PySpark, MySQL]
  - category: "BI & Visualization"
    items: [Tableau, Excel, Plotly]

