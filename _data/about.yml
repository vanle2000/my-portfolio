bio: |
  Hi, I'm Elizabeth. I'm a data scientist and computational researcher based in
  Houston, and I am currently pursuing an online M.S. in Computational Data
  Analytics at Georgia Tech. My interests sit at the intersection of statistical
  learning, scientific computing, and reliable decision-making.

  My path into data science was not linear. I began in biochemistry and pre-med
  at the University of Houston, where research in a pharmacy lab introduced me
  to mass spectrometry imaging and nanoparticle drug delivery. I found myself
  increasingly drawn to the questions behind the data: how to turn a complex
  experimental output into something interpretable, how to tell signal from
  noise, and how to know when an analytical result can be trusted.

  That curiosity led me to Adaptive Biotechnologies, where I worked alongside
  life scientists and researchers from Microsoft AI for Science on high-dimensional
  immune data. Applying unsupervised learning to questions about T-cell response
  showed me how computational methods can extend what researchers are able to
  observe — and how much care is required when a model is connected to biology.

  At the University at Buffalo, I continued this work from a different angle,
  using molecular dynamics and Python-based trajectory analysis to study
  realistic biological membranes. I later co-authored a reproducible protocol
  in the Journal of Visualized Experiments. Together, these experiences shaped
  the question that continues to motivate me: how can we build models that are
  not only accurate, but also well evaluated, interpretable, and useful in the
  scientific workflows around them?

  Outside of work, I enjoy travelling, hiking and camping, astrology, matcha,
  and writing movie reviews.
