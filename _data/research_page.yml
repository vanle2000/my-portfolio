intro: >
  My research interests grew from a practical question: what makes a model
  useful when the data are noisy, incomplete, and tied to real decisions?
  Across biomedical research, manufacturing, and applied analytics, I have
  seen that predictive performance is only one part of the answer. I am
  interested in methods that help researchers understand uncertainty, test
  whether models remain reliable when conditions change, and use AI without
  giving up human judgment.

interests:
  - title: "Statistical Learning for Scientific Data"
    description: >
      Developing statistical and machine learning methods for data generated
      by scientific instruments, simulations, and experiments, where the
      structure of the problem matters as much as the size of the dataset.
  - title: "Uncertainty & Robust Evaluation"
    description: >
      Studying how models communicate uncertainty, how performance changes
      under distribution shift, and how evaluation can reveal when a
      prediction is useful — or when it should not be trusted.
  - title: "Causal Inference & Experiment Design"
    description: >
      Moving beyond association to ask which interventions change an outcome,
      how experiments can be designed efficiently, and what assumptions are
      required before a result can support a decision.
  - title: "Human-Centered AI"
    description: >
      Understanding how researchers and analysts work with ML and language
      models, where automation genuinely helps, and how interfaces and
      workflows can preserve context, accountability, and human judgment.

experience:
  - lab: "Monje Lab"
    lab_url: "https://monjegroup.myportfolio.com/"
    institution: "University at Buffalo, Dept. of Chemical & Biological Engineering"
    pi: "Dr. Viviana Monje-Galván"
    years: "2022 – 2023"
    project: >
      In the Monje Lab, I helped develop and validate a reproducible workflow
      for constructing realistic biological membrane models from complex lipid
      mixtures and analyzing them through molecular dynamics simulations.
    motivation: >
      Biological membranes contain many interacting lipid species, yet
      simulations often reduce them to much simpler systems. We wanted to make
      biologically realistic models more reproducible, so researchers could
      study membrane structure, proteins, and drug interactions on a stronger
      computational foundation.
    outcomes: >
      I co-authored the resulting protocol in the Journal of Visualized
      Experiments. My contributions included Python-based trajectory analysis
      for lipid order parameters, area per lipid, membrane thickness, and
      lateral diffusion, as well as work on the modeling pipeline used by the
      lab.
    relevance: >
      This project taught me that building a model is only the beginning. The
      more interesting work is deciding how to validate it, which assumptions
      matter, and whether another researcher can reproduce and extend the
      result. It is where my interest in model evaluation and uncertainty
      became a research direction.

  - lab: "Liu Lab"
    lab_url: "https://www.uh.edu/pharmacy/about-us/directory-home/pps-faculty/xinli-liu/"
    institution: "University of Houston, College of Pharmacy"
    pi: "Dr. Xinli Liu"
    years: "2020 – 2022"
    project: >
      In the Liu Lab, I built Python workflows for mass spectrometry imaging
      data used to study nanoparticle drug delivery and cellular resistance to
      nanomedicine.
    motivation: >
      Each pixel in a mass spectrometry image contains a full spectrum, making
      the raw output both spatially rich and difficult to analyze. The lab
      needed a reliable path from instrument output to interpretable patterns
      in how cells absorbed or resisted nanoparticle formulations.
    outcomes: >
      I developed preprocessing steps for baseline correction, peak alignment,
      and dimensionality reduction, turning high-dimensional imaging data into
      analysis-ready representations. I also supported experiments evaluating
      nanoparticle formulations in cell-culture models.
    relevance: >
      This was the experience that changed my direction from pre-med to data
      science. I saw that an experiment can generate more information than a
      team can readily interpret, and that thoughtful computational tools can
      become part of the scientific method itself. That idea still guides the
      kind of research I hope to pursue.
