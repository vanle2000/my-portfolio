intro: >
  My research direction is grounded in a practical question: how can people
  make better decisions with models when the evidence is incomplete, noisy,
  and changing? I am interested in statistical learning, Bayesian statistics,
  causal inference, and uncertainty quantification as complementary ways to
  reason from data — not only to improve prediction, but to understand what
  the evidence supports. I am also interested in AI-augmented analytics: how
  researchers and analysts can work with AI systems while keeping assumptions
  visible, uncertainty explicit, and human judgment accountable.

interests:
  - title: "Statistical Learning & Bayesian Modeling"
    description: >
      Combining flexible predictive methods with probabilistic reasoning to
      learn from scientific and operational data, incorporate prior knowledge,
      and update conclusions as new evidence becomes available.
  - title: "Causal Inference & Experimentation"
    description: >
      Moving beyond association to ask which interventions change an outcome,
      how experiments and quasi-experiments can be designed responsibly, and
      which assumptions must hold before a result can guide action.
  - title: "Uncertainty & Robust Evaluation"
    description: >
      Studying how models express uncertainty, how performance changes under
      distribution shift, and how evaluation can reveal when a prediction is
      useful — or when a system should defer to human judgment.
  - title: "AI-Augmented Analytics"
    description: >
      Exploring how analysts and researchers can collaborate with machine
      learning and language-model tools while preserving context,
      reproducibility, accountability, and meaningful human oversight.

experience:
  - lab: "Monje Lab"
    lab_url: "https://monjegroup.myportfolio.com/"
    institution: "University at Buffalo, Dept. of Chemical & Biological Engineering"
    pi: "Dr. Viviana Monje-Galván"
    years: "2022 – 2023"
    story: |
      At the Monje Lab, I became interested in a deceptively simple question:
      how realistic must a membrane model be before its behavior can
      meaningfully represent biology? Biological membranes contain many
      interacting lipid species, yet simulations often reduce them to much
      simpler systems. Our goal was to make complex membrane models easier to
      construct, evaluate, and reproduce so they could provide a stronger
      foundation for studying membrane structure, proteins, and drug
      interactions.

      I helped develop the computational workflow and used Python-based
      trajectory analysis to examine lipid order parameters, area per lipid,
      membrane thickness, and lateral diffusion. I also contributed to the
      membrane-protein modeling pipeline and to documenting the decisions
      needed for another researcher to reproduce the analysis.

      The work became a peer-reviewed protocol in the *Journal of Visualized
      Experiments*. More importantly, it changed how I think about modeling: a
      successful run is not the same as a trustworthy result. This experience
      drew me toward questions of uncertainty, model evaluation, and the role
      of reproducibility in scientific computing.

  - lab: "Liu Lab"
    lab_url: "https://www.uh.edu/pharmacy/about-us/directory-home/pps-faculty/xinli-liu/"
    institution: "University of Houston, College of Pharmacy"
    pi: "Dr. Xinli Liu"
    years: "2020 – 2022"
    story: |
      My path toward data science began in the Liu Lab, where I worked with
      mass spectrometry imaging data used to study nanoparticle drug delivery
      and cellular resistance to nanomedicine. Each pixel in an image contains
      a full mass spectrum, so the scientific value of an experiment depends
      on turning a large, high-dimensional output into patterns that a research
      team can interpret.

      I built Python workflows for baseline correction, peak alignment, and
      dimensionality reduction, transforming raw instrument output into
      analysis-ready representations. I also supported cell-culture experiments
      evaluating nanoparticle formulations, which helped me understand how
      computational choices and experimental context shape one another.

      The immediate benefit was a clearer and more repeatable path from
      instrument data to downstream analysis. For me, the deeper outcome was
      discovering that computational methods can become part of the scientific
      process itself. That realization led me from pre-med toward data science
      and continues to guide my interest in research data science and applied
      statistical work.
