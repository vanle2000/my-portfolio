    ### Citation
    Campbell, O., Le, V., Aguirre, A., & Monje-Galvan, V. (2023). "Realistic
    Membrane Modeling Using Complex Lipid Mixtures in Simulation Studies."
    *Journal of Visualized Experiments*, e65712.

    ### The Research Question
    Biological membranes are mixtures of many lipid species whose interactions
    shape membrane structure, dynamics, and protein behavior. Yet computational
    studies often rely on simplified bilayers. Our goal was to make more
    realistic membrane simulations easier to construct, validate, and reproduce.

    ### My Role
    I worked in the **Monje Lab** at the University at Buffalo under
    Dr. Viviana Monje-Galván. My contributions included:

    - Molecular-dynamics trajectory analysis using Python and MDAnalysis
    - Analysis of lipid order parameters, area per lipid, membrane thickness,
      and lateral diffusion
    - Work on a membrane-protein modeling pipeline incorporating
      deep-learning-based structure prediction
    - CHARMM force-field parameterization for novel lipid species
    - Validation and documentation of the workflow reported in the JoVE paper

    ### Methods
    We used the CHARMM36 force field with TIP3P water and constructed complex
    lipid mixtures through CHARMM-GUI. The analysis workflow compared several
    structural and dynamical properties to determine whether the simulated
    membranes behaved consistently with physical expectations.

    ### Why It Matters
    A reusable protocol allows other researchers to move beyond single-lipid
    systems and study membranes that more closely resemble those found in
    living cells. That creates a stronger computational basis for investigating
    membrane proteins, lipid interactions, and drug behavior.

    ### What I Learned
    This was my first sustained experience with computational model validation.
    It taught me to think beyond whether a simulation runs successfully and ask
    whether its assumptions are visible, its behavior is physically plausible,
    and its results can be reproduced by someone else. Those questions continue
    to shape my interest in reliable scientific machine learning.
