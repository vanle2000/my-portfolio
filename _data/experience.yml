intro: >
  My path has moved from biological data to scientific model validation and,
  more recently, to production machine-learning systems. Across those settings,
  I have become interested in the same underlying problem: how to build models
  whose evidence, uncertainty, and failure modes are clear enough to support a
  consequential decision.

chapters:
  - period: "Summer 2022"
    focus: "Computational biology"
    title: "Finding structure when labels do not yet exist"
    organization: "Adaptive Biotechnologies"
    role: "Data Science Intern"
    narrative: >
      Working with high-dimensional single-cell immune data, I used PCA and
      unsupervised clustering to ask whether meaningful subpopulations could be
      found without a predefined target. The purpose was not simply to produce
      clusters, but to test whether the structure was stable, interpretable,
      and useful enough for domain scientists to pursue as a new research
      direction.
    reflection: >
      This experience showed me how computational methods can extend what
      scientists are able to observe—and why model choices must be evaluated
      against the geometry and uncertainty of the data.

  - period: "Summer 2023"
    focus: "Scientific model validation"
    title: "Testing where a model holds—and where it breaks"
    organization: "Merck & Co."
    role: "Data Science Intern"
    narrative: >
      I evaluated mechanistic manufacturing models against more than 570,000
      experimental observations, using held-out batch conditions, residual
      structure, sensitivity analysis, and empirical baselines to understand
      where each model generalized beyond its calibrated operating range.
    reflection: >
      The central lesson was that a model becomes useful not when it fits
      historical data, but when its assumptions and failure boundaries are
      clear enough to support a real scientific decision.

  - period: "2024 – Present"
    focus: "Production ML systems"
    title: "Designing the full path from evidence to decision"
    organization: "Starpoint Investment"
    role: "Business Intelligence Analyst → Data Scientist"
    narrative: >
      I began by designing data models and integrity checks for multi-source
      financial records. That work grew into ownership of containerized ML and
      LLM systems for invoice ingestion, entity resolution, classification,
      abstention, and API-based decisioning across clients with different
      vendors and charts of accounts.
    reflection: >
      The purpose is to build systems that know when evidence is strong enough
      to act and when uncertainty should be returned to a person. This has made
      asymmetric error cost, calibration, system evaluation, and
      reproducibility central to my work.

  - period: "Selected projects"
    focus: "Independent inquiry"
    title: "Stress-testing causal and decision models"
    organization: "Causal inference, uplift modeling & optimization"
    role: "Independent technical work"
    narrative: >
      In independent projects, I deliberately create difficult evaluation
      settings: injected confounding, weak overlap, violated assumptions, and
      fixed-budget constraints. I compare estimators against known ground truth
      or operational baselines rather than treating a strong headline metric as
      sufficient evidence.
    reflection: >
      These projects let me investigate the question connecting my applied
      work: how can we tell whether a model's recommendation remains credible
      when the data-generating process is imperfect?

  - period: "2026 – Present"
    focus: "Graduate direction"
    title: "Turning applied questions into a research agenda"
    organization: "Georgia Institute of Technology"
    role: "M.S. Computational Data Analytics"
    narrative: >
      Building on my undergraduate training in computational and applied
      mathematics at SUNY Buffalo, graduate study is helping me deepen the
      statistical and computational language behind questions that first
      emerged in biological research, model validation, and production ML.
    reflection: >
      My current direction is reliable statistical learning for scientific and
      high-stakes data, especially evaluation under distribution shift,
      uncertainty-aware decision rules, and productive human oversight.
