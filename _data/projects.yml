- slug: stock-data-pipeline
  title: "Stock Market Data Pipeline"
  subtitle: "The reproducible feature foundation under the modeling work — scoped honestly"
  tags: [Python, Pandas, Parquet, PCA, Feature Engineering, Docker, FastAPI]
  status: "Complete"
  year: 2023
  figure: "/assets/images/project-data-pipeline.svg"
  figure_alt: "Raw per-ticker OHLCV files merged, de-duplicated, feature-engineered, and compressed into reusable model inputs"
  github: "https://github.com/vanle2000/Stock-based-Recommendation-System"
  summary: >
    The feature foundation under my stock-modeling work: a reproducible pipeline
    that merges per-ticker OHLCV files into a ~2.47M-row table, engineers 20+
    technical indicators, and compresses them with PCA into reusable model
    inputs — with the scope stated honestly rather than inflated.
  metrics:
    - value: "2.47"
      unit: "M"
      label: "OHLCV rows after merge and de-duplication"
    - value: "3,610"
      label: "NASDAQ/NYSE tickers after the metadata join"
    - value: "20+"
      label: "technical indicators engineered per ticker"
    - value: "5"
      label: "PCA components fed to every downstream model"
  highlights:
    - Merged per-ticker Kaggle OHLCV files (1999–2017) into a single ~2.47M-row de-duplicated table
    - Engineered 20+ technical indicators (RSI, MACD, Bollinger Bands, ATR, OBV) with Parquet checkpointing between stages
    - Compressed the feature set to 5 PCA components reused by both the price and similarity models
    - Dockerised and served behind FastAPI, YAML-configured so new tickers/indicators need no code change
  body: |
    ## What this is
    Before any modeling, I needed a repeatable way to turn years of raw
    per-ticker market data into a consistent, documented feature table that the
    price model and the autoencoder could both share. This post is about that
    foundation — and about scoping it honestly, because the easiest place to
    inflate a data-engineering project is the size and sophistication of its
    pipeline.

    ## Scope
    The source is the public Kaggle "Huge Stock Market" dump — per-ticker
    `.us.txt` OHLCV files, 1999–2017, **not a live NASDAQ API**. After an inner
    join against a ticker-metadata file and de-duplication, the modeling table is
    **~2.47M rows across 3,610 tickers.** You will see larger figures in older
    notes; the committed data output is 2.47M, so that is the number I stand
    behind. The pipeline imports Spark but the actual load path that produced the
    committed data is pandas (`read_csv` over the file list) — so I describe this
    as a reproducible pandas/Parquet pipeline, not distributed processing. If I
    were scaling it past single-machine memory, moving the load and the window
    functions to real Spark `groupBy` is the first change, and I would rather name
    that honestly than imply it is already there.

    ## Pipeline
    I computed 20+ technical indicators per ticker — RSI, MACD, Bollinger Bands,
    ATR, OBV, and volume-momentum measures — partitioned by ticker and date so
    each indicator respects time order within a symbol. Intermediate tables are
    checkpointed to Parquet, so later stages do not recompute the full feature
    build and the workflow is restartable from any stage.

    ## Shared, compressed model inputs
    PCA reduces the engineered features to **five components**, which become the
    single shared input to both downstream models. Centralizing the feature
    definition here is what let the two modeling experiments stay comparable —
    they consume the exact same features rather than each re-deriving its own.

    ## Reproducibility
    The pipeline runs in Docker, exposes processed data through a FastAPI layer,
    and is driven by YAML configuration so a new ticker or a new indicator is a
    config change, not a code change.

    ## What it demonstrates
    Modeling begins long before training. Partitioning, de-duplication,
    feature-timing, and intermediate storage all decide what can be evaluated
    later and whether a result reproduces — and being precise about what the
    pipeline *is* (a reproducible single-machine feature build) rather than what
    sounds most impressive is part of doing the job to a professional bar.


