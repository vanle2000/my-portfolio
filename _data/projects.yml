- slug: criteo-uplift-causal
  title: "Criteo Causal Inference & Uplift Stress Test"
  subtitle: "Auditing observational estimators against randomized ground truth across 14M ad impressions"
  tags: [Python, Causal Inference, AIPW, Uplift Modeling, LightGBM, EconML, FastAPI, GitHub Actions]
  status: "Core analysis complete"
  year: 2026
  figure: "/assets/images/project-criteo-causal.svg"
  figure_alt: "Diagram showing a randomized experiment deliberately confounded before causal estimators are compared with the randomized target"
  github: "https://github.com/vanle2000/criteo-uplift-causal"
  metrics:
    - value: "13.98"
      unit: "M"
      label: "randomized ad impressions as the answer key"
    - value: "4.6–8.4"
      unit: "%"
      label: "AIPW bias across four conditions"
    - value: "0.813"
      label: "held-out Qini for the response estimator"
    - value: "70"
      label: "tests guarding the pipeline"
  summary: >
    I used Criteo's 13.98M-impression randomized uplift dataset as an answer
    key, deliberately introduced confounding in opposing directions, and
    audited how observational estimators recovered sample-specific RCT
    targets. In these constructed scenarios, boosted AIPW was the only tested
    estimator within single-digit bias across both outcomes and directions.
  highlights:
    - 13,979,592-row Criteo v2.1 pipeline with checksum-traced ingestion and committed reports
    - "Deflate stress test reversed the naive sign: -0.003148 estimate versus +0.000402 RCT-derived target"
    - Boosted AIPW stayed within 4.6%–8.4% bias across four outcome and scenario conditions
    - Excellent covariate balance still coincided with severe IPW bias and low effective sample size
    - "Cluster-held-out uplift ranking under the project's Qini definition: response 0.813, transformed outcome 0.659, T-learner 0.003"
    - 70 tests plus FastAPI scoring, drift checks, and promotion-gated retraining scaffolding
  body: |
    ## The result, up front
    Confounding pushed the naive conversion estimate to **+237% of the truth**
    and, in the mirror scenario, to the **wrong sign** entirely. Against an
    RCT-derived target re-standardised onto the exact rows each estimator used,
    only one method landed within single digits in all four test conditions:
    doubly-robust **AIPW** on gradient-boosted propensity scores, at
    **+4.6% / −8.3%** bias on conversion and **−8.4% / −5.3%** on visit.

    | estimator | inflate · conversion | deflate · conversion | inflate · visit | deflate · visit |
    |---|---|---|---|---|
    | naive (no adjustment) | +237% | −882% | +595% | −2024% |
    | IPW (gradient-boosted PS) | −92% | −0.1% | −49% | −0.2% |
    | **AIPW, doubly robust (GBM PS)** | **+4.6%** | **−8.3%** | **−8.4%** | **−5.3%** |
    | PSM 1:1 NN (GBM PS) | −11% | −19% | +13% | −20% |
    | g-computation | −34% | +34% | +11% | −10% |
    | IPW (linear PS) | −283% | +182% | −1439% | +329% |

    ## The question
    Observational causal methods are usually judged without knowing the true
    effect. This project runs a harder test: start with a real randomized
    experiment, treat its treatment contrast as an answer key, deliberately
    break the randomization, apply the standard observational toolkit to the
    wreckage, and **score each method against the truth it was supposed to
    find**. Making failure visible is the whole point.

    ## Data and the answer key
    The source is the Criteo Uplift Prediction dataset v2.1 —
    **13,979,592 ad impressions**, 85% treated / 15% control, with `visit` and
    `conversion` labels and 12 anonymised features. Three properties of the data
    shape every downstream choice: the rows are impressions, not people
    (13.98M rows carry 9.17M distinct covariate vectors, so a proxy cluster id
    is needed and every interval is clustered on it, design effect 2.0–3.5×);
    the impression-level "RCT" is not perfectly balanced (max |SMD| 0.049); and
    the score is massively tied, which can strand a predicted-uplift decile with
    zero control units if ties are broken carelessly.

    The randomized ground truth, cross-checked three ways (Lin adjustment, a
    100-stratum standardisation, and a cluster-collapsed estimate):

    | outcome | control rate | treated rate | ATE (ITT) | relative lift |
    |---|---|---|---|---|
    | `visit` | 0.03820 | 0.04854 | **+0.010342** | +27.1% |
    | `conversion` | 0.00194 | 0.00309 | **+0.001152** | +59.4% |

    Conversion runs at 0.29% — 40,774 positives in 14M rows. That rarity drives
    every metric choice later.

    ## Breaking randomization on purpose
    Rows are selected into an observational subsample with a probability that
    depends on both the treatment arm and a prognostic score (a control-arm
    outcome model, holdout AUC 0.947). Selecting on a covariate that predicts
    the outcome is deliberate: selecting on noise would produce imbalance but no
    bias, demonstrating nothing. At selection strength k = 3 on 7.01M retained
    rows, max |SMD| explodes from **0.049 to 1.102**, and the naive conversion
    estimate becomes 3.37× the truth. The mirror `deflate` scenario reverses the
    rule until ads appear to *reduce* conversion: **−0.003148 against a true
    +0.000402**.

    ![Standardised mean differences for all twelve covariates: tight around zero under the RCT, blown far past the Rubin thresholds once confounding is introduced.](/assets/images/criteo/step2_balance_rct_vs_confounded.png)
    <p class="detail__figcaption">The randomized sample sits on the zero line; the confounded sample scatters past ±1.0. The imbalance is engineered — and the true subsample effect is recomputed for the new covariate mix rather than copied from the full sample.</p>

    ## Which estimators recover the target
    Boosted-propensity AIPW is the only estimator with single-digit bias across
    both outcomes and both directions. Its 95% interval covers the RCT target;
    the naive estimate and both linear-propensity specifications are badly off.

    ![Forest plot of estimated conversion ATEs against the dashed RCT target; AIPW on boosted propensity sits on the line while naive and IPW miss.](/assets/images/criteo/step3_forest_conversion_inflate.png)
    <p class="detail__figcaption">Green intervals cover the RCT target of +0.001603; red miss it. Doubly-robust AIPW on a gradient-boosted propensity is the estimate that lands on the truth.</p>

    ## Balance is necessary — and nowhere near sufficient
    This is the finding worth the project. IPW weighting drove every covariate
    |SMD| from as high as 1.10 down to ≤ 0.049 — a textbook balance table — yet
    the conversion estimate was still **92% biased**. The reason is not visible
    in a balance plot: the same weights left an effective control sample of
    **192,289 out of 1,061,480** (max weight 1,171). With the misspecified
    linear propensity it is worse — effective control sample 4,270, a visit
    estimate of −0.159 against a true +0.012. Effective sample size is printed
    beside every weighted estimate for exactly this reason.

    ![Absolute standardised mean differences per covariate before adjustment, after IPW weighting, and after 1:1 matching, nearly all pulled below the 0.1 threshold.](/assets/images/criteo/step3_balance_conversion_inflate.png)
    <p class="detail__figcaption">Every covariate is driven under the balance threshold after adjustment — the kind of table that passes review — while the weighted point estimate remains 92% wrong.</p>

    Two related traps appear in the same step. Matching's confidence interval is
    **14× narrower** than AIPW's on identical data, because the matched-pair
    standard error ignores both propensity estimation and control reuse; the
    point estimates look respectable (−11% to −20%) but the coverage does not.
    And common-support trimming silently changes the question — restricting to
    e ∈ [0.02, 0.98] moves the conversion target from +0.001603 to +0.000224,
    because it discards exactly the high-propensity units where the uplift
    lives. Trimmed estimates are scored against a re-standardised trimmed target.

    ## Sensitivity, and the E-value trap
    With no answer key you can only ask how strong an unmeasured confounder would
    have to be. Rosenbaum bounds on 5.95M matched pairs give Γ* = 1.41 for
    conversion — a 41% shift in treatment odds between otherwise-identical units
    would end significance. Not robust, and the honest verdict on the matched
    analysis. The sharper lesson: **the most biased estimator carries the
    largest E-value.** The naive conversion estimate (237% wrong) implies an
    E-value of 4.26, while AIPW's E-value (2.23) lands almost exactly on the
    truth's (2.19). An E-value measures the *size of the claim*, never whether
    it is right — a distinction only visible because the RCT was there to check.

    ## Uplift ranking, including a result I did not want
    Trained on 10.4M rows, evaluated on 3.60M held out, split by cluster so no
    unit crosses the split. Two uncomfortable findings:

    | model | Qini | uplift @ top 10% | vs untargeted | captured share @ 10% |
    |---|---|---|---|---|
    | two-model T-learner | +0.0033 | +0.001868 | 1.35× | 13.5% |
    | transformed outcome | +0.6590 | +0.009090 | 6.58× | 65.8% |
    | **response baseline** | **+0.8133** | +0.009902 | **7.17×** | 71.7% |

    ![Qini curves on the held-out randomized sample: the response baseline and transformed-outcome learner rise steeply above the diagonal while the two-model T-learner tracks random targeting.](/assets/images/criteo/step4_qini_conversion.png)
    <p class="detail__figcaption">The two-model T-learner is indistinguishable from random targeting; a plain response model with no causal content ranks uplift best of all — which is exactly why causal ranking must be benchmarked against a response baseline.</p>

    The T-learner differences two models each larger than the effect between
    them, on a 0.29% outcome, and the errors do not cancel. The response model
    wins because here uplift is nearly proportional to baseline conversion
    propensity, so the response ordering is almost the uplift ordering and is
    estimated far more precisely. The *served* model is still the
    transformed-outcome learner, deliberately: a response model emits
    P(convert), not an increment, so it cannot tell a bidder how much extra
    conversion one more impression buys. Class imbalance is handled honestly —
    AUC-PR 0.1834 against a 0.00338 base rate (54.3× a random ranker); accuracy
    is never reported, because predicting "never converts" scores 99.66% and
    means nothing.

    ## Engineering around the result
    The repository commits machine-readable and narrative reports, the figures
    above, a LightGBM artifact, a FastAPI service (`/health` reports whether the
    artifact actually loaded; 3.5 ms for a 2-row batch; malformed input → 422),
    a multi-stage non-root Docker image, a promotion-gated retrain that refuses
    to overwrite a good model with one more than 10% worse, and a drift monitor
    that pages on per-feature PSI. **70 self-contained tests** run with no
    dataset — the causal tests are simulations with known ground truth. I call
    this operational scaffolding, not a live deployment: the scheduled workflow
    reuses the same static source, so it demonstrates automation, not adaptation
    to changing traffic.

    ## Where the assumptions break
    The estimates are causal here only because I wrote the selection rule, so
    unconfoundedness holds by construction. On real ad data it usually does not —
    bid-time context, competitive pressure, and intent are rarely all in the
    feature set. Positivity is technically satisfied but thin at the top, which
    is why IPW's effective sample collapses. SUTVA is close to a worst case in
    auction advertising: suppressing ads to a control group changes the price and
    win rate for everyone else, so the control arm is not a clean untreated world.
    The DiD component uses a simulated pre-period and so demonstrates estimator
    mechanics, not an identified empirical effect. These are properties of the
    assumptions, not of the code.

    ## What it demonstrates
    A causal estimate deserves *more* skepticism when its diagnostics look clean,
    not less. The reusable practices: inspect effective sample size and weight
    behavior alongside balance, recompute the estimand after any selection or
    trimming, and benchmark causal ranking against a simple response model.
    Reliable causal work is an audit — define the target, create opportunities to
    be wrong, and make those failures visible.


- slug: facebook-ads-efficiency
  title: "Facebook Ads Efficiency & Audience Saturation"
  subtitle: "Finding the reallocatable budget pool — and refusing to promise a lift the data can't defend"
  tags: [R, SQL, DuckDB, tidymodels, A/B Design, Marketing Analytics]
  status: "Complete · methods demo"
  year: 2024
  figure: "/assets/images/project-ads-efficiency.svg"
  figure_alt: "Spend concentrated in zero-conversion ads, with a reallocatable budget pool and an A/B test to validate it"
  github: "https://github.com/vanle2000/Facebook-ads-lose-efficiency-after-audience-saturation"
  summary: >
    On a 1,143-ad public dataset I measured where budget is spent without
    returning approved conversions, found a 25.1% reallocatable pool, and drew
    the line a stakeholder needs: the pool is measured, the resulting lift is
    not — so the deliverable is a pre-registered A/B test, not a promised number.
  metrics:
    - value: "48.9"
      unit: "%"
      label: "of ads produced zero approved conversions"
    - value: "25.1"
      unit: "%"
      label: "of budget sitting in that reallocatable pool"
    - value: "5.8"
      unit: "×"
      label: "CPA spread across interest segments"
    - value: "3.2"
      unit: "×"
      label: "CPA for the oldest bracket vs the youngest"
  highlights:
    - SQL + DuckDB metric layer (CTR, CPC, CPM, CPA, ROAS) with every reported number regenerated by a script
    - Isolated the reallocatable pool — 559 of 1,143 ads (48.9%) spending $14,754 (25.1% of budget) on zero approved conversions
    - Surfaced a monotonic CPA-by-age gradient and a 5.8× interest-segment spread a reallocation can exploit
    - Pre-registered A/B test design as the honest validation path, because an observational set cannot measure the lift
  body: |
    ## The result, up front
    On this advertiser's data, **559 of 1,143 ads (48.9%) produced zero approved
    conversions** while consuming **$14,754 — 25.1% of total budget.** That pool
    is the finding: a quarter of spend is reallocatable. What I deliberately do
    *not* claim is a lift number from moving it, because an observational dataset
    cannot measure what reallocation would actually cause. The honest deliverable
    is a pre-registered experiment, and this write-up is as careful about that
    boundary as it is about the measurement.

    ## Scope, stated honestly
    This is a methods demonstration on the public Kaggle "sales conversion"
    dataset — **1,143 ads from a single advertiser.** That is large enough to run
    the SQL → metric → modeling → experiment-design workflow end to end and for
    the descriptive findings to be solid, and too small to support production ML
    claims. I keep that distinction loud: predictive models are included to show
    technique, not to assert field-ready accuracy. Every number below is
    regenerated by `python scripts/compute_summary.py`; if the prose and the
    script ever disagree, the script wins.

    ## The business question
    A campaign keeps buying clicks long after those clicks stop turning into
    approved conversions. The question a media buyer has is operational: *which
    audience segments spend budget without returning proportional approved
    conversions, and how much of that budget can move?*

    ## The metric layer
    I used SQL on DuckDB to turn raw ad rows into an analysis table and compute
    CTR, CPC, CPM, CPA, ROAS, and segment-level conversion rates, with a Makefile
    and `renv` for reproducibility. The headline operating picture:

    | Metric | Value |
    |---|---|
    | Ads | 1,143 |
    | Total spend | $58,705 |
    | Approved conversions | 1,079 |
    | Overall CPA | $54.41 |
    | Conversion rate (approved / click) | 2.83% |

    ## Where the budget leaks
    The inefficiency is concentrated, not diffuse. Beyond the 48.9% of ads
    returning nothing, cost structure varies sharply across who is being
    targeted:

    - **CPA rises monotonically with age** — $30.88 (30–34) → $53.68 → $68.17 →
      $99.76 (45–49). The oldest bracket costs **3.2×** the youngest per approved
      conversion.
    - **Men convert cheaper than women** here — CPA $41.44 vs $69.70.
    - Across 40 interest segments, CPA ranges **$18.69 to $107.97** (median
      $56.10) — a **5.8× spread**, which is exactly the dispersion a reallocation
      strategy exploits.

    ## The recommendation — and its honest boundary
    The move is to pull the 25.1% spent on zero-conversion ads toward the
    sub-median-CPA segments. But here is the line I will not cross: the
    *reallocatable budget* is measured; the *resulting lift* is not. Whether the
    efficient segments keep their low CPA as you pour more budget into them is a
    causal question — it depends on saturation, and an observational snapshot
    cannot answer it. So the budget simulator reports a **range under an explicit
    constant-CPA assumption**, flagged as an assumption, and the real deliverable
    is the next step.

    ## The honest validation: a pre-registered A/B test
    The repo ships an experiment design (control = current allocation, treatment
    = reallocated spend) as the only credible way to turn the 25.1% pool into a
    defensible lift estimate. No single "X% lift" headline is claimed anywhere,
    because this dataset cannot defend one.



- slug: github-support-analytics
  title: "GitHub Support Operations Analytics"
  subtitle: "A support-operations warehouse, then audited against its own published claims"
  tags: [SQL, Star Schema, Python, VADER, Data Modeling, Synthetic Data]
  status: "Complete · self-audited"
  year: 2024
  figure: "/assets/images/project-support-analytics.svg"
  figure_alt: "Star-schema warehouse feeding a claim-verification gate that recomputes every published metric"
  github: "https://github.com/vanle2000/GitHub-support-operations-analytics"
  summary: >
    I built a support-operations warehouse on synthetic data, published five
    headline findings, then wrote a gate that recomputes every published number
    from the data. Four of the five did not reproduce. The audit — and what the
    data can and cannot support — is the project.
  metrics:
    - value: "2,000"
      label: "synthetic tickets across 40 repositories, one seeded generator"
    - value: "4"
      unit: "/5"
      label: "headline findings that did not reproduce under the gate"
    - value: "7"
      unit: "/7"
      label: "schema integrity checks passing on every load"
    - value: "12.1"
      unit: "pp"
      label: "swing from how the SLA rate is aggregated"
  highlights:
    - Star-schema warehouse (3 dimensions + 1 ticket-grain fact) with a 7-assertion integrity block that passes on every load
    - A claim-verification gate that recomputes each published metric from the data and exits non-zero on drift
    - Found four of five original headline numbers were generator artefacts, not findings, and retracted them
    - Reproducible SLA-breach and retention analysis that the 2,000-row synthetic dataset can actually defend
  body: |
    ## What this is, up front
    I built a support-operations data warehouse on **synthetic data**, published
    a confident set of findings — and then wrote a gate that recomputes every
    published number straight from the data. **Four of the five original
    headlines did not reproduce.** They were artefacts of the generator, not
    discoveries. This post is the audit: how a clean-looking result can be an
    accident of how the data was made, and what the dataset can honestly
    support once you stop it from flattering itself.

    ## The business question
    An open-source org can count issues and pull requests all day, but the count
    does not say whether contributors feel supported. The operational question a
    maintainer actually has is: *which repositories are at risk, and what lever
    moves the risk?* First-response latency, conversation sentiment, and
    contributor retention are the candidate signals.

    ## The data system
    I modeled the problem as a star schema (PostgreSQL): three dimensions —
    repositories, authors (tiered Newbie / Regular / Maintainer under a CHECK
    constraint), and labels — and one fact table at **one row per ticket**, with
    surrogate keys minted from the natural keys and a `UNIQUE` natural key to
    stop double-loads. The DDL ships a **7-assertion verification block** that
    must report PASS on every load (row counts, key uniqueness, referential
    integrity), and the load is idempotent via `DROP ... IF EXISTS` at the top.
    The data itself is 2,000 tickets across 40 repositories, fabricated by a
    seeded generator — I had no access to real GitHub support data, and I say so
    at the top of the repo rather than implying otherwise.

    ## Why I stopped trusting my own findings
    The first version published five headlines, including "a first response
    within 12 hours is associated with a 3.5× higher repeat-contributor rate."
    It looked great. Then I read my own generator. Response time and contributor
    retention were both defined as functions of the *same latent* `health`
    variable:

        contributor_retention = health * 0.7 + noise

    So "fast responses correlate with retention" was never a discovery — it was
    an assignment statement. `corr(health, retention) = 0.819` **by
    construction.** The analysis recovered exactly what the generator was told
    to encode. That is the most important lesson in the whole project, and it is
    invisible unless you go back and check.

    ## The claim-verification gate
    Instead of quietly deleting the bad numbers, I built a gate
    (`recompute_findings.py`) that holds every originally published claim in a
    table with a tolerance, rebuilds the schema in memory, recomputes each metric
    from the shipped data, and **exits non-zero if any published number no longer
    matches.** It is run with `python scripts/recompute_findings.py`. Here is
    what it reports:

    | Previously published | Recomputed from the data | Verdict |
    |---|---|---|
    | 12% of repos "toxic" | 2.5% (shipped view) | does not reproduce |
    | 12h response → 3.5× repeat contributors | 1.01× — and not computable at all | does not reproduce |
    | >3 comments → +40% negative sentiment | +16.2 percentage points | does not reproduce |
    | 50+ raw labels standardised | 10 | does not reproduce |
    | Health score on a 0–100 scale | ceiling is 80 | does not reproduce |

    The 3.5× claim is the sharpest failure. Contributor retention in this data
    has **exactly one distinct value per repository** — it is a repo-level
    attribute broadcast onto every ticket row, not an author-level outcome. There
    is no per-author retention variable to regress against response time, so the
    3.5× was not merely wrong, it was *uncomputable* from the schema as built.

    ## What the data can actually support
    Once the circular metrics are retired, a smaller, honest set of findings
    survives — and the gate confirms each one reproduces:

    - **SLA breach rates** against a 24-hour first-response target, per repo,
      across the 2,000-ticket population.
    - **Repo-grain retention is structurally near-zero** — 1.5% to 15.4%, median
      6.1% — because 500 authors filing 2,000 tickets across 40 repos simply do
      not generate enough repeat activity per repo. That is the real analytical
      finding: *retention cannot carry the 50% weight the original health score
      put on it.*
    - **Rolling SLA attainment swings up to 12.1 percentage points** depending on
      how you aggregate the rate (per-ticket vs per-period) — a reminder that the
      denominator choice is a decision, not a detail.

    ## What a BIE takes from this
    The deliverable a stakeholder trusts is not the dashboard — it is the
    guarantee that every number on it still reproduces from source. Three
    practices carried over from this project: model at a single, explicit grain
    and enforce it with constraints; make every published metric regenerable by a
    gate that fails loudly on drift; and interrogate how the data was produced
    before interpreting any correlation it shows. The honest version of this
    project is smaller than the first draft, and far more defensible.



- slug: chronic-disease-risk
  title: "Chronic Disease Risk Intelligence"
  subtitle: "A self-audit: how I found target and temporal leakage in my own CDC model"
  tags: [Python, Scikit-learn, KMeans, Leakage Audit, Panel Data, GeoPandas]
  status: "In progress · audited"
  year: 2024
  figure: "/assets/images/project-health-risk.svg"
  figure_alt: "A near-perfect classifier revealed as target leakage; a rebuild plan with time-ordered evaluation"
  github: "https://github.com/vanle2000/Chronic-disease-risks-in-US"
  summary: >
    I built a geographic risk model on 20 years of CDC surveillance data, got a
    near-perfect classifier, and recognized it as target leakage rather than a
    result. The current repo is the honest audit — five documented defects and a
    rebuild plan — because reporting a leaking 0.99 accuracy as a win would be
    the opposite of the job.
  metrics:
    - value: "794.8"
      unit: "K"
      label: "CDC surveillance records, 2001–2021, state aggregates"
    - value: "5"
      label: "defects documented in my own first version"
    - value: "2"
      label: "distinct leakage paths found — target and temporal"
    - value: "27"
      label: "tests, 4 of them deliberately still failing"
  highlights:
    - Caught a near-perfect (0.99997-accuracy) classifier as target leakage, not a result, and documented it rather than publishing it
    - Traced two leakage paths — a label derived from a feature the model also sees, and a shuffled split on a state×year panel
    - Reframed the project around a budget-prioritization metric with honest known-limitations (ecological/aggregation bias, ~50 effective clusters)
    - 27 tests with 4 deliberately-failing cases flagging a brittle volume assertion still to fix
  body: |
    ## What this is, up front
    I set out to group U.S. states by chronic-disease risk profile and predict
    higher-mortality outcomes from 20 years of CDC surveillance data. One of my
    classifiers scored **0.99997 accuracy.** That is not a triumph — it is a
    symptom, and recognizing it as **target leakage** is the actual result of
    this project. The repo today is a self-audit: five documented defects and a
    rebuild plan, published honestly instead of a leaderboard number I could not
    defend.

    ## The data
    The source is the CDC U.S. Chronic Disease Indicators dataset —
    **794,819 records**, spanning **2001–2021**, at the level of **state
    aggregates** (not individuals). The features are survey indicators across
    chronic-disease topics with demographic stratifications and a parsed
    geolocation. The grain matters for everything downstream: this is repeated
    cross-sections of state-level aggregates, so there are effectively ~50
    geographic units, not hundreds of thousands of independent observations.

    ## Leakage path one: the label was built from a feature
    My risk label was a `pd.cut` on the raw indicator value (`DataValueAlt`) into
    bands at 100k / 250k / 500k — thresholds only certain *measure types* can
    reach. I then handed the model the encoded measure-type flag
    (`DataValueType`) as a feature. So the model could reconstruct its own label
    from the one column that determines it. A near-perfect score was inevitable;
    the classifier had learned an identity, not a risk pattern. The honest fix —
    drop the derived label, forecast the underlying rate against a benchmark — is
    documented and scheduled, not yet implemented, and I say so plainly rather
    than quietly shipping the leaking number.

    ## Leakage path two: a shuffled split on a time panel
    The evaluation used `StratifiedKFold(shuffle=True)` on what is really a
    state × year panel. Shuffling lets a state's 2021 rows train a model that is
    then tested on that same state's 2015 rows — future leaking into past. On
    panel data the split has to be **time-ordered**; the correct version is
    described in the repo as the next rebuild step. Until it is in place, no
    accuracy or AUC from this pipeline is trustworthy, so I am not publishing one
    as a headline.

    ## Why there are no headline metrics here
    An earlier coursework notebook reported a silhouette of 0.635 and a macro-F1
    of 0.85. I deliberately do **not** feature those: the 0.635 was computed on a
    clustering input the current code no longer uses, and the 0.85 F1 came from
    the 0.99997-accuracy model — i.e. the leaking one. Presenting either as a
    current result would be exactly the kind of unearned claim this audit exists
    to catch. The reframed project targets a defensible public-health metric (an
    excess-burden / budget-prioritization measure) with its benchmark choice
    stated as a choice.

    ## The testing story
    The repo has 27 tests; **4 of them fail** — on purpose, for now — because an
    early `clean()` step hard-codes `assert len(df) > 100`, which smaller test
    fixtures trip. It is a small, real defect, left visible in the test report
    rather than silenced, and queued with the rest. There is no CI yet; wiring it
    up is part of the same rebuild.

    ## Honest limitations
    Even once the leakage is fixed, the data imposes hard ceilings I keep in
    front: CDI is state aggregates, so any individual-level reading is an
    ecological fallacy; the panel of indicators I selected is a judgment call
    that shapes every result; and with ~50 geographic clusters, clustered
    standard errors over-reject, so causal language is off the table. The useful
    output is prioritization for further investigation, not a claim about
    individual risk or about geography causing outcomes.

    ## What it demonstrates
    The most valuable skill this project shows is not a model — it is the
    judgment to distrust a 0.99 accuracy, trace it to its two root causes, and
    write the correction down instead of shipping the number. A result that looks
    too good is a lead to investigate, not a win to publish; owning that in your
    own work is the bar.



