- slug: stock-recommendation
  title: "Stock Recommendation System"
  subtitle: "How I caught my own R²=0.997 as a leakage artefact — and what the honest result is"
  tags: [Python, Time-Series CV, LinearSVR, TensorFlow, Leakage Audit, FastAPI]
  status: "Complete · corrected"
  year: 2023
  figure: "/assets/images/project-stock-model.svg"
  figure_alt: "A near-perfect price-level R-squared revealed as a persistence artefact once reframed on returns"
  github: "https://github.com/vanle2000/Stock-based-Recommendation-System"
  summary: >
    I headlined this project with R²=0.997 for next-day price prediction, then
    discovered it was a level-scale artefact — "tomorrow = today" scores 0.997
    by itself. Reframed on returns against a persistence baseline, the real
    out-of-sample R² is slightly negative and directional accuracy is a coin
    flip. Documenting that correction is the project.
  metrics:
    - value: "0.997"
      label: "price-level R² — an artefact a no-op baseline already matches"
    - value: "−0.010"
      label: "honest out-of-sample R² on returns"
    - value: "51.2"
      unit: "%"
      label: "directional accuracy — a coin flip"
    - value: "0.999"
      label: "adjacent-close correlation that produced the illusion"
  highlights:
    - Diagnosed a headline R²=0.997 as a price-level artefact — adjacent closes correlate at 0.999, so "tomorrow = today" scores 0.997 with no model
    - Rebuilt evaluation on next-day returns with walk-forward splits and a gap, scored against no-change and persistence baselines
    - Honest result:  out-of-sample R² −0.010, directional accuracy 51.2%, information coefficient +0.056 — daily returns are near-unpredictable from lagged indicators
    - Autoencoder compresses features to a 5-dim latent space for cosine-similarity stock retrieval (qualitative); FastAPI serving; 47 tests passing under CI
  body: |
    ## The result, up front
    The first version of this project headlined **R² = 0.997 for next-day price
    prediction.** It is the most impressive number I have ever produced and it is
    **worthless** — and catching that is the point of this write-up. Adjacent
    daily closing prices correlate at **0.999**, so the trivial rule
    *tomorrow = today* already scores R² = 0.997 with no model at all. My
    LinearSVR had learned nothing; it was riding the autocorrelation of a price
    *level*. Reframed correctly, the honest answer is that daily equity returns
    are **near-unpredictable** from lagged technical indicators — and that is the
    correct, expected result.

    ## How the artefact happened
    Predicting the next day's *price level* from features derived from today's
    prices is a trap: the target barely moves between adjacent days, so any model
    inherits a near-1.0 R² for free. The tell was in the diagnostics I had
    already run — I was differencing the target before an ARIMA fit (you only
    difference a non-stationary *level* series) and my error metrics were in
    dollar units (RMSE ≈ 7.3, MAPE ≈ 13%), magnitudes that are impossible for a
    daily-return target. The split was actually fine (per-ticker chronological,
    no shuffle). The target definition was the bug.

    ## The correction
    I rebuilt the evaluation around the quantity that actually matters —
    **next-day return**, `r = Close_t+1 / Close_t − 1` — using only lagged-return
    features, walk-forward cross-validation (`TimeSeriesSplit`, 5 folds, a 1-step
    gap to prevent leakage), and I scored every model against **two baselines a
    reviewer expects**: "no change" (r̂ = 0) and persistence (r̂ = today's
    return). The code reproduces the whole thing with
    `python -m src.models.returns_prediction`.

    | model | OOS R² (model) | OOS R² (naive r=0) | directional acc. | info. coef. |
    |---|---|---|---|---|
    | LinearSVR | **−0.010** | −0.003 | 51.2% | +0.056 |
    | Ridge | −0.008 | −0.003 | 50.3% | +0.042 |

    The out-of-sample R² is **negative** — worse than predicting zero — and
    directional accuracy sits on the coin flip. That is not a bug to fix by
    hunting for a higher number; it is the real finding. The earlier 0.997 only
    hid it behind a level-scale artefact. I kept a `demonstrate_level_leakage()`
    function in the repo that reproduces the illusion on demand, so the mistake
    is documented rather than quietly deleted.

    ## The part that does hold up: representation learning
    The genuinely useful half of the system is unsupervised. An autoencoder
    (TensorFlow/Keras) compresses each stock's normalized feature profile into a
    **5-dimensional latent space**, and cosine similarity in that space retrieves
    stocks with related historical behavior. I report this as a qualitative
    retrieval tool, not a backtested strategy — it finds structural neighbors,
    which is a defensible claim, rather than predicting price, which is not.

    ## Data and engineering
    The data is real historical OHLCV from a public Kaggle market dump
    (~2.47M rows after merging and de-duplication, 1999–2017), with 20+ technical
    indicators (RSI, MACD, Bollinger Bands, volume momentum) compressed by PCA to
    five components. The system is served behind FastAPI and locked in by **47
    tests running under CI** — including a test that pins the returns-based
    numbers so the corrected result cannot silently regress back into the
    artefact.

    ## What it demonstrates
    A strong metric is not strong evidence — it is a reason to inspect the
    experimental design harder. The reusable discipline from this project:
    predict the right target (returns, not levels), always carry a persistence
    baseline, use directional accuracy and information coefficient rather than R²
    alone on noisy series, and write a test that keeps a corrected result
    corrected. Being able to find and own this class of error is more valuable
    than any single leaderboard number.



- slug: stock-data-pipeline
  title: "Stock Market Data Pipeline"
  subtitle: "The reproducible feature foundation under the modeling work — scoped honestly"
  tags: [Python, Pandas, Parquet, PCA, Feature Engineering, Docker, FastAPI]
  status: "Complete"
  year: 2023
  figure: "/assets/images/project-data-pipeline.svg"
  figure_alt: "Raw per-ticker OHLCV files merged, de-duplicated, feature-engineered, and compressed into reusable model inputs"
  github: "https://github.com/vanle2000/Stock-based-Recommendation-System"
  summary: >
    The feature foundation under my stock-modeling work: a reproducible pipeline
    that merges per-ticker OHLCV files into a ~2.47M-row table, engineers 20+
    technical indicators, and compresses them with PCA into reusable model
    inputs — with the scope stated honestly rather than inflated.
  metrics:
    - value: "2.47"
      unit: "M"
      label: "OHLCV rows after merge and de-duplication"
    - value: "3,610"
      label: "NASDAQ/NYSE tickers after the metadata join"
    - value: "20+"
      label: "technical indicators engineered per ticker"
    - value: "5"
      label: "PCA components fed to every downstream model"
  highlights:
    - Merged per-ticker Kaggle OHLCV files (1999–2017) into a single ~2.47M-row de-duplicated table
    - Engineered 20+ technical indicators (RSI, MACD, Bollinger Bands, ATR, OBV) with Parquet checkpointing between stages
    - Compressed the feature set to 5 PCA components reused by both the price and similarity models
    - Dockerised and served behind FastAPI, YAML-configured so new tickers/indicators need no code change
  body: |
    ## What this is
    Before any modeling, I needed a repeatable way to turn years of raw
    per-ticker market data into a consistent, documented feature table that the
    price model and the autoencoder could both share. This post is about that
    foundation — and about scoping it honestly, because the easiest place to
    inflate a data-engineering project is the size and sophistication of its
    pipeline.

    ## The honest scope
    The source is the public Kaggle "Huge Stock Market" dump — per-ticker
    `.us.txt` OHLCV files, 1999–2017, **not a live NASDAQ API**. After an inner
    join against a ticker-metadata file and de-duplication, the modeling table is
    **~2.47M rows across 3,610 tickers.** You will see larger figures in older
    notes; the committed data output is 2.47M, so that is the number I stand
    behind. The pipeline imports Spark but the actual load path that produced the
    committed data is pandas (`read_csv` over the file list) — so I describe this
    as a reproducible pandas/Parquet pipeline, not distributed processing. If I
    were scaling it past single-machine memory, moving the load and the window
    functions to real Spark `groupBy` is the first change, and I would rather name
    that honestly than imply it is already there.

    ## Feature engineering
    I computed 20+ technical indicators per ticker — RSI, MACD, Bollinger Bands,
    ATR, OBV, and volume-momentum measures — partitioned by ticker and date so
    each indicator respects time order within a symbol. Intermediate tables are
    checkpointed to Parquet, so later stages do not recompute the full feature
    build and the workflow is restartable from any stage.

    ## Shared, compressed model inputs
    PCA reduces the engineered features to **five components**, which become the
    single shared input to both downstream models. Centralizing the feature
    definition here is what let the two modeling experiments stay comparable —
    they consume the exact same features rather than each re-deriving its own.

    ## Reproducibility
    The pipeline runs in Docker, exposes processed data through a FastAPI layer,
    and is driven by YAML configuration so a new ticker or a new indicator is a
    config change, not a code change.

    ## What it demonstrates
    Modeling begins long before training. Partitioning, de-duplication,
    feature-timing, and intermediate storage all decide what can be evaluated
    later and whether a result reproduces — and being precise about what the
    pipeline *is* (a reproducible single-machine feature build) rather than what
    sounds most impressive is part of doing the job to a professional bar.


