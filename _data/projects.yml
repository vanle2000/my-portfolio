- slug: criteo-uplift-causal
  title: "Criteo Causal Inference & Uplift Stress Test"
  subtitle: "Auditing observational estimators against randomized ground truth across 14M ad impressions"
  tags: [Python, Causal Inference, AIPW, Uplift Modeling, LightGBM, EconML, FastAPI, GitHub Actions]
  status: "Core analysis complete"
  year: 2026
  figure: "/assets/images/project-criteo-causal.svg"
  figure_alt: "Diagram showing a randomized experiment deliberately confounded before causal estimators are compared with the randomized target"
  github: "https://github.com/vanle2000/criteo-uplift-causal"
  metrics:
    - value: "13.98"
      unit: "M"
      label: "randomized ad impressions as the answer key"
    - value: "4.6–8.4"
      unit: "%"
      label: "AIPW bias across four conditions"
    - value: "0.813"
      label: "held-out Qini for the response estimator"
    - value: "70"
      label: "tests guarding the pipeline"
  summary: >
    I used Criteo's 13.98M-impression randomized uplift dataset as an answer
    key, deliberately introduced confounding in opposing directions, and
    audited how observational estimators recovered sample-specific RCT
    targets. In these constructed scenarios, boosted AIPW was the only tested
    estimator within single-digit bias across both outcomes and directions.
  highlights:
    - 13,979,592-row Criteo v2.1 pipeline with checksum-traced ingestion and committed reports
    - "Deflate stress test reversed the naive sign: -0.003148 estimate versus +0.000402 RCT-derived target"
    - Boosted AIPW stayed within 4.6%–8.4% bias across four outcome and scenario conditions
    - Excellent covariate balance still coincided with severe IPW bias and low effective sample size
    - "Cluster-held-out uplift ranking under the project's Qini definition: response 0.813, transformed outcome 0.659, T-learner 0.003"
    - 70 tests plus FastAPI scoring, drift checks, and promotion-gated retraining scaffolding
  body: |
    ## The result, up front
    Confounding pushed the naive conversion estimate to **+237% of the truth**
    and, in the mirror scenario, to the **wrong sign** entirely. Against an
    RCT-derived target re-standardised onto the exact rows each estimator used,
    only one method landed within single digits in all four test conditions:
    doubly-robust **AIPW** on gradient-boosted propensity scores, at
    **+4.6% / −8.3%** bias on conversion and **−8.4% / −5.3%** on visit.

    | estimator | inflate · conversion | deflate · conversion | inflate · visit | deflate · visit |
    |---|---|---|---|---|
    | naive (no adjustment) | +237% | −882% | +595% | −2024% |
    | IPW (gradient-boosted PS) | −92% | −0.1% | −49% | −0.2% |
    | **AIPW, doubly robust (GBM PS)** | **+4.6%** | **−8.3%** | **−8.4%** | **−5.3%** |
    | PSM 1:1 NN (GBM PS) | −11% | −19% | +13% | −20% |
    | g-computation | −34% | +34% | +11% | −10% |
    | IPW (linear PS) | −283% | +182% | −1439% | +329% |

    ## The question
    Observational causal methods are usually judged without knowing the true
    effect. This project runs a harder test: start with a real randomized
    experiment, treat its treatment contrast as an answer key, deliberately
    break the randomization, apply the standard observational toolkit to the
    wreckage, and **score each method against the truth it was supposed to
    find**. Making failure visible is the whole point.

    ## Data and the answer key
    The source is the Criteo Uplift Prediction dataset v2.1 —
    **13,979,592 ad impressions**, 85% treated / 15% control, with `visit` and
    `conversion` labels and 12 anonymised features. Three properties of the data
    shape every downstream choice: the rows are impressions, not people
    (13.98M rows carry 9.17M distinct covariate vectors, so a proxy cluster id
    is needed and every interval is clustered on it, design effect 2.0–3.5×);
    the impression-level "RCT" is not perfectly balanced (max |SMD| 0.049); and
    the score is massively tied, which can strand a predicted-uplift decile with
    zero control units if ties are broken carelessly.

    The randomized ground truth, cross-checked three ways (Lin adjustment, a
    100-stratum standardisation, and a cluster-collapsed estimate):

    | outcome | control rate | treated rate | ATE (ITT) | relative lift |
    |---|---|---|---|---|
    | `visit` | 0.03820 | 0.04854 | **+0.010342** | +27.1% |
    | `conversion` | 0.00194 | 0.00309 | **+0.001152** | +59.4% |

    Conversion runs at 0.29% — 40,774 positives in 14M rows. That rarity drives
    every metric choice later.

    ## Breaking randomization on purpose
    Rows are selected into an observational subsample with a probability that
    depends on both the treatment arm and a prognostic score (a control-arm
    outcome model, holdout AUC 0.947). Selecting on a covariate that predicts
    the outcome is deliberate: selecting on noise would produce imbalance but no
    bias, demonstrating nothing. At selection strength k = 3 on 7.01M retained
    rows, max |SMD| explodes from **0.049 to 1.102**, and the naive conversion
    estimate becomes 3.37× the truth. The mirror `deflate` scenario reverses the
    rule until ads appear to *reduce* conversion: **−0.003148 against a true
    +0.000402**.

    ![Standardised mean differences for all twelve covariates: tight around zero under the RCT, blown far past the Rubin thresholds once confounding is introduced.](/assets/images/criteo/step2_balance_rct_vs_confounded.png)
    <p class="detail__figcaption">The randomized sample sits on the zero line; the confounded sample scatters past ±1.0. The imbalance is engineered — and the true subsample effect is recomputed for the new covariate mix rather than copied from the full sample.</p>

    ## Which estimators recover the target
    Boosted-propensity AIPW is the only estimator with single-digit bias across
    both outcomes and both directions. Its 95% interval covers the RCT target;
    the naive estimate and both linear-propensity specifications are badly off.

    ![Forest plot of estimated conversion ATEs against the dashed RCT target; AIPW on boosted propensity sits on the line while naive and IPW miss.](/assets/images/criteo/step3_forest_conversion_inflate.png)
    <p class="detail__figcaption">Green intervals cover the RCT target of +0.001603; red miss it. Doubly-robust AIPW on a gradient-boosted propensity is the estimate that lands on the truth.</p>

    ## Balance is necessary — and nowhere near sufficient
    This is the finding worth the project. IPW weighting drove every covariate
    |SMD| from as high as 1.10 down to ≤ 0.049 — a textbook balance table — yet
    the conversion estimate was still **92% biased**. The reason is not visible
    in a balance plot: the same weights left an effective control sample of
    **192,289 out of 1,061,480** (max weight 1,171). With the misspecified
    linear propensity it is worse — effective control sample 4,270, a visit
    estimate of −0.159 against a true +0.012. Effective sample size is printed
    beside every weighted estimate for exactly this reason.

    ![Absolute standardised mean differences per covariate before adjustment, after IPW weighting, and after 1:1 matching, nearly all pulled below the 0.1 threshold.](/assets/images/criteo/step3_balance_conversion_inflate.png)
    <p class="detail__figcaption">Every covariate is driven under the balance threshold after adjustment — the kind of table that passes review — while the weighted point estimate remains 92% wrong.</p>

    Two related traps appear in the same step. Matching's confidence interval is
    **14× narrower** than AIPW's on identical data, because the matched-pair
    standard error ignores both propensity estimation and control reuse; the
    point estimates look respectable (−11% to −20%) but the coverage does not.
    And common-support trimming silently changes the question — restricting to
    e ∈ [0.02, 0.98] moves the conversion target from +0.001603 to +0.000224,
    because it discards exactly the high-propensity units where the uplift
    lives. Trimmed estimates are scored against a re-standardised trimmed target.

    ## Sensitivity, and the E-value trap
    With no answer key you can only ask how strong an unmeasured confounder would
    have to be. Rosenbaum bounds on 5.95M matched pairs give Γ* = 1.41 for
    conversion — a 41% shift in treatment odds between otherwise-identical units
    would end significance. Not robust, and the honest verdict on the matched
    analysis. The sharper lesson: **the most biased estimator carries the
    largest E-value.** The naive conversion estimate (237% wrong) implies an
    E-value of 4.26, while AIPW's E-value (2.23) lands almost exactly on the
    truth's (2.19). An E-value measures the *size of the claim*, never whether
    it is right — a distinction only visible because the RCT was there to check.

    ## Uplift ranking, including a result I did not want
    Trained on 10.4M rows, evaluated on 3.60M held out, split by cluster so no
    unit crosses the split. Two uncomfortable findings:

    | model | Qini | uplift @ top 10% | vs untargeted | captured share @ 10% |
    |---|---|---|---|---|
    | two-model T-learner | +0.0033 | +0.001868 | 1.35× | 13.5% |
    | transformed outcome | +0.6590 | +0.009090 | 6.58× | 65.8% |
    | **response baseline** | **+0.8133** | +0.009902 | **7.17×** | 71.7% |

    ![Qini curves on the held-out randomized sample: the response baseline and transformed-outcome learner rise steeply above the diagonal while the two-model T-learner tracks random targeting.](/assets/images/criteo/step4_qini_conversion.png)
    <p class="detail__figcaption">The two-model T-learner is indistinguishable from random targeting; a plain response model with no causal content ranks uplift best of all — which is exactly why causal ranking must be benchmarked against a response baseline.</p>

    The T-learner differences two models each larger than the effect between
    them, on a 0.29% outcome, and the errors do not cancel. The response model
    wins because here uplift is nearly proportional to baseline conversion
    propensity, so the response ordering is almost the uplift ordering and is
    estimated far more precisely. The *served* model is still the
    transformed-outcome learner, deliberately: a response model emits
    P(convert), not an increment, so it cannot tell a bidder how much extra
    conversion one more impression buys. Class imbalance is handled honestly —
    AUC-PR 0.1834 against a 0.00338 base rate (54.3× a random ranker); accuracy
    is never reported, because predicting "never converts" scores 99.66% and
    means nothing.

    ## Engineering around the result
    The repository commits machine-readable and narrative reports, the figures
    above, a LightGBM artifact, a FastAPI service (`/health` reports whether the
    artifact actually loaded; 3.5 ms for a 2-row batch; malformed input → 422),
    a multi-stage non-root Docker image, a promotion-gated retrain that refuses
    to overwrite a good model with one more than 10% worse, and a drift monitor
    that pages on per-feature PSI. **70 self-contained tests** run with no
    dataset — the causal tests are simulations with known ground truth. I call
    this operational scaffolding, not a live deployment: the scheduled workflow
    reuses the same static source, so it demonstrates automation, not adaptation
    to changing traffic.

    ## Where the assumptions break
    The estimates are causal here only because I wrote the selection rule, so
    unconfoundedness holds by construction. On real ad data it usually does not —
    bid-time context, competitive pressure, and intent are rarely all in the
    feature set. Positivity is technically satisfied but thin at the top, which
    is why IPW's effective sample collapses. SUTVA is close to a worst case in
    auction advertising: suppressing ads to a control group changes the price and
    win rate for everyone else, so the control arm is not a clean untreated world.
    The DiD component uses a simulated pre-period and so demonstrates estimator
    mechanics, not an identified empirical effect. These are properties of the
    assumptions, not of the code.

    ## What it demonstrates
    A causal estimate deserves *more* skepticism when its diagnostics look clean,
    not less. The reusable practices: inspect effective sample size and weight
    behavior alongside balance, recompute the estimand after any selection or
    trimming, and benchmark causal ranking against a simple response model.
    Reliable causal work is an audit — define the target, create opportunities to
    be wrong, and make those failures visible.


- slug: facebook-ads-efficiency
  title: "Facebook Ads Efficiency & Audience Saturation"
  subtitle: "Exploring audience saturation through modeling and budget simulation"
  tags: [R, SQL, DuckDB, XGBoost, Shiny, tidymodels]
  status: "Complete"
  year: 2024
  figure: "/assets/images/project-ads-efficiency.svg"
  figure_alt: "Chart showing campaign saturation and budget reallocation across audience segments"
  github: "https://github.com/vanle2000/Facebook-ads-lose-efficiency-after-audience-saturation"
  summary: >
    I studied how advertising efficiency changes as an audience becomes
    saturated, combining SQL-based metric engineering, conversion modeling,
    and a simulation of how budget might be reallocated without increasing
    total spend.
  highlights:
    - SQL + DuckDB pipeline engineering CTR, CPC, CPM, CPA, ROAS metrics
    - XGBoost & Random Forest conversion classifiers with ROC-AUC evaluation
    - Budget reallocation simulator estimating CPA improvement per segment
    - Interactive Shiny dashboard for stakeholder exploration
    - A/B test design framework for campaign validation
  body: |
    ### The Question
    A campaign can continue generating clicks even after those clicks stop
    translating into approved conversions. I wanted to understand whether that
    pattern could be detected at the audience-segment level and translated into
    a more useful budgeting decision.

    ### My Approach
    I used SQL and DuckDB to transform raw campaign events into an
    analysis-ready table and calculated CTR, CPC, CPM, CPA, ROAS, and
    segment-level conversion rates. A Makefile and `renv` environment make the
    workflow reproducible.

    ### Modeling and Evaluation
    I trained XGBoost and Random Forest classifiers with tidymodels and
    cross-validation to estimate conversion probability. Rather than treating
    the model score as the final answer, I compared it with spend and efficiency
    metrics to identify segments whose cost was rising faster than their
    conversion performance.

    ### From Prediction to Decision
    I built a simulation layer to explore what might happen if budget were
    shifted from lower-efficiency segments to stronger ones while holding total
    spend constant. An interactive Shiny application lets users inspect the
    assumptions, segment metrics, model outputs, and reallocation scenarios.

    ### What I Learned
    This project reinforced the difference between predicting an outcome and
    recommending an intervention. A simulation can help formulate a hypothesis,
    but a controlled experiment is still needed before claiming that a budget
    change caused an improvement.

- slug: github-support-analytics
  title: "GitHub Support Operations Analytics"
  subtitle: "Studying response time, sentiment, and contributor retention"
  tags: [Python, SQL Server, SQLAlchemy, VADER NLP, Power BI]
  status: "Complete"
  year: 2024
  figure: "/assets/images/project-support-analytics.svg"
  figure_alt: "Network diagram connecting support conversations with response and sentiment trajectories"
  github: "https://github.com/vanle2000/GitHub-support-operations-analytics"
  summary: >
    I built an analytics system for studying the health of open-source support
    communities, connecting response time, conversation sentiment, and
    contributor behavior through a SQL warehouse and reproducible ETL pipeline.
  highlights:
    - Star-schema warehouse ingesting GitHub Issues & PR event streams via SQLAlchemy
    - VADER sentiment scoring pipeline across 100K+ support interactions
    - SLA breach model classifying repos into 5 risk tiers
    - Power BI dashboards surfacing contributor health metrics
  body: |
    ### The Question
    Open-source maintainers can count issues and pull requests, but those totals
    do not necessarily reveal whether contributors feel supported. I wanted to
    examine whether response latency and the tone of a conversation could help
    identify communities at risk of losing contributors.

    ### Data System
    I designed a SQL Server star schema and SQLAlchemy ETL jobs for GitHub issue
    and pull-request events. The pipeline normalizes event streams into fact and
    dimension tables, runs idempotently, and supports repeated analysis as new
    activity arrives.

    ### Analysis
    VADER sentiment scores provide a simple trajectory for each support thread.
    I combined those trajectories with response latency and thread length to
    classify repositories into five operational risk tiers.

    ### Observed Patterns
    - A first response within 12 hours was associated with a **3.5× higher**
      repeat-contributor rate in the analyzed sample
    - **12% of repositories** were flagged as high risk under the scoring model
    - Negative sentiment appeared before contributor churn in 71% of the
      identified cases

    ### What I Learned
    These patterns are descriptive rather than causal. Repository size,
    governance, contributor experience, and project maturity may influence both
    response behavior and retention. The project taught me to treat operational
    metrics as signals for further investigation, not explanations by
    themselves.

- slug: chronic-disease-risk
  title: "Chronic Disease Risk Intelligence"
  subtitle: "Finding geographic patterns in 20 years of CDC surveillance data"
  tags: [Python, Scikit-learn, KMeans, Random Forest, GeoPandas, Plotly]
  status: "Complete"
  year: 2024
  figure: "/assets/images/project-health-risk.svg"
  figure_alt: "Geographic surveillance cells grouped into health-risk cohorts and evaluated over time"
  github: "https://github.com/vanle2000/Chronic-disease-risks-in-US"
  summary: >
    I analyzed 20 years of CDC chronic-disease surveillance data to explore
    geographic patterns in health risk and evaluate how well state-level
    indicators could distinguish higher-mortality outcomes.
  highlights:
    - 900K records, 50 states, 20-year longitudinal span
    - K-Means clustering with silhouette score 0.635
    - Random Forest mortality classifier — AUC 0.73, macro F1 0.85
    - GeoPandas choropleth maps + Plotly interactive dashboards
  body: |
    ### The Question
    Public-health datasets contain years of information, but their scale and
    uneven reporting can make broad patterns difficult to see. I asked whether
    states could be grouped by shared risk profiles and whether those profiles
    contained useful information about mortality outcomes.

    ### Data and Preparation
    I worked with approximately 900,000 records from the CDC Chronic Disease
    Indicators dataset covering 2001–2021. I used state-year medians for missing
    values, normalized indicators before clustering, and created year-over-year
    features to represent changing trends.

    ### Exploring Geographic Structure
    K-Means clustering, with the number of clusters selected through elbow and
    silhouette analysis, produced six geographic risk cohorts and a silhouette
    score of **0.635**. The resulting groups reflected persistent regional
    differences visible across multiple indicators.

    ### Predictive Evaluation
    I trained a Random Forest classifier to distinguish above-median mortality
    outcomes and evaluated it with year-ordered splits. The model achieved an
    AUC of **0.73** and macro F1 of **0.85**.

    ### What I Learned
    State-level patterns are useful for exploration, but they should not be
    interpreted as individual risk or as evidence that geography itself causes
    an outcome. This project strengthened my interest in careful evaluation,
    aggregation bias, and the difference between prediction and explanation.

- slug: marathon-analysis
  title: "Marathon Performance Analysis"
  subtitle: "Modeling pacing archetypes and finish-time prediction"
  tags: [Python, SciPy, KDE, Bayesian Inference, KNN, Linear Regression]
  status: "Complete"
  year: 2023
  figure: "/assets/images/project-marathon.svg"
  figure_alt: "Several marathon pacing trajectories following different paths toward the finish"
  github: "https://github.com/vanle2000/Analysis-marathon-result-and-predict-performance-of-runners"
  summary: >
    I used data from 26,000 Boston Marathon finishers to study pacing behavior,
    build a custom density-based classifier for runner archetypes, and evaluate
    how early-race information predicts finish time.
  highlights:
    - 26,000 runner dataset with split-by-split pace profiles
    - Custom KDEBayesClassifier built on SciPy's gaussian_kde
    - 2-D KDE classification accuracy 77.5%
    - Linear regression finish-time prediction R² 0.85
    - 26 unit tests covering all model components
  body: |
    ### The Question
    Marathon runners reach the halfway point with very different pacing
    histories. I wanted to know whether those patterns could be represented as
    runner archetypes and how much of the final time could be estimated from
    information available earlier in the race.

    ### A Density-Based Classifier
    I implemented a custom `KDEBayesClassifier` using SciPy's
    `gaussian_kde`. For each pacing archetype, the model estimates a
    two-dimensional density over halfway and finishing pace, then applies
    Bayes' rule to assign a class. It achieved **77.5%** classification
    accuracy.

    ### Finish-Time Modeling
    A linear regression model used halfway time, age group, bib tier, and
    weather conditions to estimate finish time. I preserved year ordering
    during validation and obtained an R² of **0.85** on held-out years.

    ### What I Learned
    The most rewarding part of this project was implementing a statistical
    method rather than only calling an existing estimator. I added 26 tests for
    bandwidth selection, feature preparation, and edge cases, which also taught
    me how closely reliable modeling depends on reliable software.

- slug: stock-recommendation
  title: "Stock Recommendation System"
  subtitle: "Price modeling and representation learning from market data"
  tags: [Python, LinearSVR, TensorFlow, PCA, FastAPI]
  status: "Complete"
  year: 2023
  figure: "/assets/images/project-stock-model.svg"
  figure_alt: "Market observations transformed into a compact embedding space for stock similarity"
  github: "https://github.com/vanle2000/Stock-based-Recommendation-System"
  summary: >
    I explored two different questions in one system: whether technical
    indicators could support short-horizon price estimation, and whether an
    autoencoder could learn useful representations for finding similar stocks.
  highlights:
    - LinearSVR on PCA-compressed 20+ technical indicators — R² 0.997
    - Walk-forward cross-validation preserving time ordering
    - Autoencoder stock embeddings for nearest-neighbour recommendations
    - FastAPI serving layer; 45 tests
  body: |
    ### Two Related Questions
    I separated the project into two models. A LinearSVR estimates short-horizon
    prices from engineered market features, while an autoencoder learns compact
    representations for similarity-based recommendations. Both are exposed
    through a shared FastAPI service.

    ### Feature Representation
    I calculated more than 20 indicators from OHLCV data, including RSI, MACD,
    Bollinger Bands, and volume momentum. PCA reduced these features to five
    orthogonal components before training the SVR.

    ### Time-Ordered Evaluation
    I used walk-forward validation with a 252-day training window and a 21-day
    test window. The resulting R² of **0.997** is unusually high for financial
    prediction and should be interpreted cautiously. It motivates additional
    checks for target construction, temporal leakage, non-stationarity, simple
    persistence baselines, and performance after transaction costs.

    ### Representation Learning
    The autoencoder compresses normalized return profiles into an
    eight-dimensional embedding. Cosine similarity in that space provides a
    way to retrieve stocks with related historical behavior.

    ### What I Learned
    This project made skepticism part of my modeling process. A strong metric is
    not automatically strong evidence; it is often a reason to inspect the
    experimental design more closely.

- slug: stock-data-pipeline
  title: "Stock Market Data Pipeline"
  subtitle: "A reproducible PySpark workflow for 10M+ market records"
  tags: [PySpark, Pandas, PCA, Docker, FastAPI, NASDAQ API]
  status: "Complete"
  year: 2023
  figure: "/assets/images/project-data-pipeline.svg"
  figure_alt: "Market records flowing through distributed feature processing into reusable outputs"
  github: "https://github.com/vanle2000/Stock-based-Recommendation-System"
  summary: >
    I built the data foundation for the stock-modeling project: a PySpark
    pipeline that processes more than 10 million market records, calculates
    technical features, and produces reusable inputs for downstream models.
  highlights:
    - 10M+ OHLCV records across 3,600+ NASDAQ tickers
    - 20+ technical indicators computed in PySpark
    - PCA compression from 20+ features to 5 components
    - Dockerised pipeline with FastAPI data-serving layer
  body: |
    ### The Data Problem
    Before experimenting with models, I needed a repeatable way to transform
    several years of raw OHLCV records from more than 3,600 NASDAQ tickers into
    consistent features.

    ### Distributed Processing
    I partitioned data by ticker and date and used PySpark to calculate more
    than 20 technical indicators, including RSI, MACD, Bollinger Bands, ATR,
    and OBV. Intermediate tables are checkpointed in Parquet so that later
    stages do not need to repeat the full computation.

    ### Shared Model Inputs
    PCA reduces the engineered feature set to five components explaining
    approximately 94% of its variance. Those components become shared inputs
    for the prediction and representation-learning experiments.

    ### Reproducibility
    The pipeline runs in Docker, exposes processed data through FastAPI, and
    uses YAML configuration so that new tickers and indicators can be added
    without changing the main processing logic.

    ### What I Learned
    Modeling begins long before model training. Choices about partitioning,
    missing observations, feature timing, and intermediate storage all shape
    what can be evaluated later — and whether the result can be reproduced.
