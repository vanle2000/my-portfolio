<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Causal estimator stress-test diagram</title>
  <desc id="desc">A randomized experiment is deliberately confounded, then observational estimates are compared with the randomized target.</desc>
  <rect width="640" height="420" fill="#F4F6F8"/>
  <rect x="36" y="34" width="568" height="352" rx="16" fill="#FFFFFF" stroke="#E6E8EC"/>
  <text x="68" y="78" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#14171A">CAUSAL RECOVERY STRESS TEST</text>
  <text x="68" y="101" font-family="Arial,sans-serif" font-size="13" fill="#687079">randomized truth · induced confounding · estimator audit</text>

  <g transform="translate(68 132)">
    <rect width="142" height="128" rx="10" fill="#EAF4FA" stroke="#C9CFD6"/>
    <text x="18" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315E78">RCT ANSWER KEY</text>
    <circle cx="42" cy="67" r="19" fill="#6FA8C9"/>
    <circle cx="98" cy="67" r="19" fill="#F2A6C2"/>
    <text x="35" y="71" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">T</text>
    <text x="93" y="71" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">C</text>
    <text x="18" y="108" font-family="Arial,sans-serif" font-size="12" fill="#565C63">13.98M impressions</text>
  </g>

  <path d="M226 196H284" stroke="#9AA1A8" stroke-width="3"/>
  <path d="M276 188L287 196 276 204" fill="none" stroke="#9AA1A8" stroke-width="3"/>
  <text x="231" y="177" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#B06C83">BREAK IT</text>

  <g transform="translate(300 132)">
    <rect width="110" height="128" rx="10" fill="#FFF6F8" stroke="#F2A6C2"/>
    <text x="14" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#B06C83">CONFOUND</text>
    <path d="M20 88C38 38 70 103 91 49" fill="none" stroke="#F2A6C2" stroke-width="5" stroke-linecap="round"/>
    <circle cx="24" cy="81" r="7" fill="#6FA8C9"/>
    <circle cx="88" cy="54" r="7" fill="#315E78"/>
    <text x="15" y="111" font-family="Arial,sans-serif" font-size="11" fill="#565C63">inflate + deflate</text>
  </g>

  <path d="M426 196H454" stroke="#9AA1A8" stroke-width="3"/>
  <path d="M446 188L457 196 446 204" fill="none" stroke="#9AA1A8" stroke-width="3"/>

  <g transform="translate(470 126)">
    <text x="0" y="18" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315E78">RECOVER</text>
    <line x1="32" y1="36" x2="32" y2="137" stroke="#6FA8C9" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="19" y="151" font-family="Arial,sans-serif" font-size="10" fill="#315E78">target</text>
    <circle cx="4" cy="59" r="6" fill="#F2A6C2"/>
    <text x="45" y="63" font-family="Arial,sans-serif" font-size="11" fill="#565C63">naive</text>
    <circle cx="15" cy="88" r="6" fill="#BFE6F8" stroke="#6FA8C9"/>
    <text x="45" y="92" font-family="Arial,sans-serif" font-size="11" fill="#565C63">IPW</text>
    <circle cx="35" cy="117" r="7" fill="#315E78"/>
    <text x="45" y="121" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#14171A">AIPW</text>
  </g>

  <g transform="translate(68 302)" font-family="Arial,sans-serif">
    <rect width="144" height="48" rx="8" fill="#F4F6F8" stroke="#E6E8EC"/>
    <text x="72" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#14171A">2 DIRECTIONS</text>
    <text x="72" y="37" text-anchor="middle" font-size="10" fill="#687079">bias stress tests</text>
    <rect x="160" width="176" height="48" rx="8" fill="#F4F6F8" stroke="#E6E8EC"/>
    <text x="248" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#14171A">4.6–8.4% BIAS</text>
    <text x="248" y="37" text-anchor="middle" font-size="10" fill="#687079">boosted AIPW scenarios</text>
    <rect x="352" width="144" height="48" rx="8" fill="#F4F6F8" stroke="#E6E8EC"/>
    <text x="424" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#14171A">70 TESTS</text>
    <text x="424" y="37" text-anchor="middle" font-size="10" fill="#687079">methods + serving</text>
  </g>
</svg>
